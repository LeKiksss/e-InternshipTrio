<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e60000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="e&amp; Care">
  <title>Connection unavailable · e&amp; Care</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/offline.css">
</head>
<body>
  <main class="offline-shell">
    <section class="offline-card" aria-labelledby="offline-title">
      <div class="offline-brand" aria-label="e and Care">e&amp;</div>
      <span class="offline-status" data-connection-status role="status" aria-live="polite">Server unavailable</span>
      <h1 id="offline-title">We cannot reach e&amp; Care right now</h1>
      <p>Your account information stays on the server and is not stored on this offline screen. Check your connection, then try again.</p>
      <button type="button" data-offline-retry>Try again</button>
    </section>
  </main>
  <script src="/static/js/offline.js"></script>
</body>
</html>
